<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ffb3de;
    color: #ffffff;
    overflow-x: hidden;
}

/* =========================
   SUBTLE BACKGROUND
========================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at 12% 18%,
            rgba(255,255,255,0.10) 0px,
            rgba(255,255,255,0.10) 1px,
            transparent 2px
        ),
        radial-gradient(
            circle at 85% 78%,
            rgba(255,255,255,0.08) 0px,
            rgba(255,255,255,0.08) 1px,
            transparent 2px
        ),
        linear-gradient(
            135deg,
            transparent 0%,
            transparent 48%,
            rgba(255,255,255,0.035) 49%,
            transparent 50%,
            transparent 100%
        );

    background-size:
        280px 280px,
        340px 340px,
        100% 100%;

    pointer-events: none;
    z-index: -2;
}

/* =========================
   MAIN CONTAINER
========================= */

.container {
    width: 100%;
    max-width: 480px;

    margin: 0 auto;

    padding: 25px 20px 35px;

    text-align: center;
}

/* =========================
   LOGO
========================= */

.logo-wrapper {
    width: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    margin-bottom: 12px;
}

.logo {
    width: 300px;
    height: 300px;

    max-width: 90vw;

    object-fit: contain;

    display: block;
}

/* =========================
   STORE NAME
========================= */

.store-name {
    font-size: 22px;

    font-weight: 500;

    letter-spacing: 3px;

    color: #ffffff;

    margin-bottom: 7px;

    text-transform: uppercase;
}

/* =========================
   ADDRESS
========================= */

.address {
    font-size: 14px;

    color: rgba(255,255,255,0.90);

    font-weight: 400;

    margin-bottom: 23px;
}

/* =========================
   DIVIDER
========================= */

.divider {
    width: 55px;
    height: 1px;

    background: #ffffff;

    margin: 0 auto 24px;

    opacity: 0.75;
}

/* =========================
   BUTTONS
========================= */

.buttons {
    display: flex;

    flex-direction: column;

    gap: 12px;
}

.btn {
    width: 100%;

    min-height: 59px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 12px;

    padding: 15px 20px;

    color: #ffffff;

    text-decoration: none;

    font-size: 15px;

    font-weight: 600;

    letter-spacing: 0.2px;

    background: rgba(255,255,255,0.08);

    border: 1px solid rgba(255,255,255,0.75);

    border-radius: 13px;

    box-shadow:
        0 5px 16px rgba(90,40,35,0.10);

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
}

.btn:hover {
    transform: translateY(-2px);

    background: rgba(255,255,255,0.15);

    box-shadow:
        0 8px 20px rgba(90,40,35,0.16);
}

.btn:active {
    transform: scale(0.98);
}

/* =========================
   ICONS
========================= */

.icon {
    width: 23px;
    height: 23px;

    flex-shrink: 0;
}

/* =========================
   FOOTER
========================= */

.footer-line {
    display: flex;

    align-items: center;
    justify-content: center;

    margin-top: 30px;
}

.footer-line::before,
.footer-line::after {
    content: "";

    width: 55px;
    height: 1px;

    background: #ffffff;

    opacity: 0.55;
}

.footer-symbol {
    margin: 0 12px;

    font-size: 14px;

    color: #ffffff;
}

.footer {
    margin-top: 15px;

    font-size: 11px;

    color: rgba(255,255,255,0.70);

    letter-spacing: 1.5px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 380px) {

    .container {
        padding-left: 15px;
        padding-right: 15px;
    }

    .logo {
        width: 275px;
        height: 275px;
    }

    .store-name {
        font-size: 20px;
    }

    .btn {
        min-height: 55px;
        font-size: 14px;
    }

}

</style>
